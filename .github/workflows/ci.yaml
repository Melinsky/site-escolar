name: Testes e imagem de producao
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: ci-temporary-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_DRIVER: postgres
      TEST_DATABASE_URL: postgresql://postgres:ci-temporary-only@127.0.0.1:5432/postgres
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projeto-TCC/backend/package-lock.json
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: projeto-TCC/backend
      - run: npm run test:browser
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node projeto-TCC/backend/scripts/configure-production.js --domain eeafr.localhost --email ci@example.org --admin-email admin@example.org
      - run: docker compose --env-file .env.production -f compose.yaml -f compose.smoke.yaml config --quiet
      - run: docker compose --env-file .env.production -f compose.yaml -f compose.smoke.yaml up -d --build --wait --wait-timeout 180
      - name: HTTPS, banco e arquivos privados
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors --insecure --resolve eeafr.localhost:443:127.0.0.1 https://eeafr.localhost/api/health | grep '"status":"ok"'
          status=$(curl --silent --insecure --resolve eeafr.localhost:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://eeafr.localhost/backend/.env)
          test "$status" = 404
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --env-file .env.production -f compose.yaml -f compose.smoke.yaml logs --tail 100
      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose --env-file .env.production -f compose.yaml -f compose.smoke.yaml down
