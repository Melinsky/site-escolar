name: eeafr
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eeafr_owner
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_owner_password
      - postgres_app_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-eeafr.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eeafr_owner -d postgres && psql -U eeafr_owner -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='eeafr_database'\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [database]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  app:
    image: eeafr-app:local
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_URL: https://${APP_DOMAIN:?Configure APP_DOMAIN em .env.production}
      DB_DRIVER: postgres
      DB_LOCAL_MANAGED: "false"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: eeafr_database
      DB_USER: eeafr_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password
      DB_SSL: "false"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SEED_CONTENT: "false"
    secrets:
      - postgres_app_password
      - admin_password
    volumes:
      - app_data:/data
    depends_on:
      db: {condition: service_healthy}
    networks: [web, database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Configure APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: {condition: service_healthy}
    networks: [web]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  maintenance:
    image: alpine:3.23
    profiles: [tools]
    volumes:
      - app_data:/data
      - ./deploy/backups:/backups
      - ./deploy/import:/import:ro
    network_mode: none
volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
networks:
  web:
  database:
    internal: true
secrets:
  postgres_owner_password:
    file: ./deploy/secrets/postgres_owner_password.txt
  postgres_app_password:
    file: ./deploy/secrets/postgres_app_password.txt
  admin_password:
    file: ./deploy/secrets/admin_password.txt
